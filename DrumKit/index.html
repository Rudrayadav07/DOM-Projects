<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🥁 DRUM KIT</h1>
        <div class="drum-kit">
            <div class="drum-pad" data-key="Q">
                <div class="drum-label">KICK</div>
                <span class="key">Q</span>
            </div>
            <div class="drum-pad" data-key="W">
                <div class="drum-label">SNARE</div>
                <span class="key">W</span>
            </div>
            <div class="drum-pad" data-key="E">
                <div class="drum-label">CLAP</div>
                <span class="key">E</span>
            </div>
            <div class="drum-pad" data-key="A">
                <div class="drum-label">HI-HAT</div>
                <span class="key">A</span>
            </div>
            <div class="drum-pad" data-key="S">
                <div class="drum-label">OPEN HAT</div>
                <span class="key">S</span>
            </div>
            <div class="drum-pad" data-key="D">
                <div class="drum-label">CRASH</div>
                <span class="key">D</span>
            </div>
            <div class="drum-pad" data-key="Z">
                <div class="drum-label">TOM 1</div>
                <span class="key">Z</span>
            </div>
            <div class="drum-pad" data-key="X">
                <div class="drum-label">TOM 2</div>
                <span class="key">X</span>
            </div>
            <div class="drum-pad" data-key="C">
                <div class="drum-label">TOM 3</div>
                <span class="key">C</span>
            </div>
        </div>
        <p class="instructions">Press the keys or click the pads to play</p>
    </div>
    <script src="script.js"></script>
</body>
</html>
